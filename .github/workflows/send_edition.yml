# Emails the day's edition from GitHub instead of from the Claude routine.
#
# The routine builds and verifies the edition in a Claude cloud session, but
# those sessions get linked to rahul's computer, and a linked session cannot
# reach oauth2.googleapis.com to refresh the Gmail token. So the routine only
# archives the edition (editions/analyzed_content_<DATE>.bak.json on the
# archive branch) and this workflow re-verifies it and sends it.
#
# Runs:
#   - when the routine starts it (workflow_dispatch) right after archiving;
#   - at 06:40 IST as a fallback, in case the routine could not start it.
# A sent_<DATE>.txt marker on the archive branch keeps it to one mail a day.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   GMAIL_TOKEN_JSON  the same token JSON as the "ai" environment's secret
#   RECIPIENT_EMAIL   the inbox the PDF goes to

name: Send daily edition

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date, YYYY-MM-DD (default: today in IST)"
        required: false
      force:
        description: "Send even if this date was already sent"
        type: boolean
        default: false
  schedule:
    - cron: "10 1 * * *"   # 06:40 IST

permissions:
  contents: write

concurrency:
  group: send-edition
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  ARCHIVE_BRANCH: claude/daily-news-editions-2hw8xn

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pick the edition
        id: pick
        run: |
          DATE="${{ inputs.date }}"
          [ -n "$DATE" ] || DATE="$(date +%F)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          git fetch --depth=1 origin "$ARCHIVE_BRANCH"
          if git cat-file -e "FETCH_HEAD:editions/sent_${DATE}.txt" 2>/dev/null \
             && [ "${{ inputs.force }}" != "true" ]; then
            echo "Edition $DATE was already sent; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .tmp
          if ! git show "FETCH_HEAD:editions/analyzed_content_${DATE}.bak.json" > .tmp/analyzed_content.json; then
            echo "::error::No archived edition for $DATE on $ARCHIVE_BRANCH; the routine did not build one."
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.pick.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt

      - name: Verify and send
        if: steps.pick.outputs.skip != 'true'
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          if [ -z "$GMAIL_TOKEN_JSON" ] || [ -z "$RECIPIENT_EMAIL" ]; then
            echo "::error::Set the GMAIL_TOKEN_JSON and RECIPIENT_EMAIL repository secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$GMAIL_TOKEN_JSON" > token.json
          python tools/verify_edition.py --send | tee .tmp/send.log
          rm -f token.json
          grep -q "Email sent" .tmp/send.log

      - name: Mark the edition sent
        if: steps.pick.outputs.skip != 'true'
        run: |
          DATE="${{ steps.pick.outputs.date }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$ARCHIVE_BRANCH"
            git checkout -B archive FETCH_HEAD
            echo "Sent $(date -Iseconds) by run ${{ github.run_id }}" > "editions/sent_${DATE}.txt"
            git add "editions/sent_${DATE}.txt"
            git commit -m "Mark edition $DATE sent"
            git push origin "HEAD:$ARCHIVE_BRANCH" && exit 0
            sleep $((attempt * 5))
          done
          echo "::warning::Mail went out but the sent marker could not be pushed."
